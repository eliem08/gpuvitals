[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-carfax"
version = "0.1.0"
description = "Carfax for used GPUs: a health report before you buy secondhand"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
gpu-carfax = "gpu_carfax.__main__:main"

[tool.setuptools]
packages = ["gpu_carfax"]
